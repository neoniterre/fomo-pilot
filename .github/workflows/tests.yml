# Lance les 4 fichiers de tests à chaque push / pull request sur GitHub.
# Aucun réseau, aucune clé, aucun navigateur : les tests n'en ont pas besoin.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest        # même OS que le PC du bot
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - name: Installer les paquets
        run: python -m pip install -r requirements.txt
      - name: test_risk
        run: python test_risk.py
      - name: test_reader
        run: python test_reader.py
      - name: test_scanner
        run: python test_scanner.py
      - name: test_pilot
        run: python test_pilot.py
      - name: test_notify
        run: python test_notify.py
      - name: test_gardien
        run: python test_gardien.py
