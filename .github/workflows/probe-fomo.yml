name: probe-fomo
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx playwright python-dotenv && playwright install --with-deps chromium
      - run: python tools/probe_fomo.py
