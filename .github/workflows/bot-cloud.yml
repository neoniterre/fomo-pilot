name: bot-cloud
# Bot en PAPER sans PC : tourne ~5 h 45 puis se relance tout seul. L'état (positions, historique de prix,
# trades) est sauvegardé sur la branche `data` toutes les 15 min. Arrêt d'urgence : créer un fichier STOP
# à la racine de la branche `data`, ou désactiver ce workflow (onglet Actions).
on:
  schedule:
    - cron: "17 */6 * * *"        # filet de sécurité si la chaîne s'interrompt
  workflow_dispatch:
    inputs:
      minutes:
        description: "durée du run en minutes (défaut 345)"
        default: "345"
      chain:
        description: "relancer automatiquement à la fin (false pour un simple test)"
        default: "true"
permissions:
  contents: write
  actions: write
concurrency:
  group: bot-cloud
  cancel-in-progress: false
env:
  TZ: Europe/Paris                # rapport quotidien et changement de jour à l'heure de Paris
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Branche data (état)
        run: |
          git config user.name "fomo-pilot-bot"
          git config user.email "bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add ../data origin/data -B data
          else
            git worktree add --orphan -b data ../data
          fi
          if [ -f ../data/STOP ]; then echo "STOP présent : arrêt demandé."; echo "STOPPED=1" >> "$GITHUB_ENV"; fi
          for f in state.json history.json trades.jsonl position_trace.jsonl; do [ -f ../data/$f ] && cp ../data/$f . || true; done
          ls -la state.json history.json trades.jsonl position_trace.jsonl 2>/dev/null || echo "(premier run : pas d'état)"

      - uses: actions/setup-python@v5
        if: env.STOPPED != '1'
        with:
          python-version: "3.12"
      - name: Dépendances
        if: env.STOPPED != '1'
        run: python -m pip install -r requirements.txt && python -m playwright install --with-deps chromium

      - name: Bot (PAPER, --cloud)
        if: env.STOPPED != '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          save() {
            for f in state.json history.json trades.jsonl position_trace.jsonl; do [ -f "$f" ] && cp "$f" ../data/ || true; done
            cd ../data
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "état $(date -u +%FT%TZ)"
              for i in 1 2 3; do git push -q origin HEAD:data && break || { git pull -q --rebase origin data || true; sleep 3; }; done
            fi
            cd - >/dev/null
          }
          (while sleep 900; do save; done) &
          SAVER=$!
          PLANNED_MIN="${{ github.event.inputs.minutes || '345' }}"
          START=$(date +%s)
          timeout "${PLANNED_MIN}m" python pilot.py --auto --cloud \
            --capital 20 --min-30m 20 --min-1h 50 --scan-every 60 --interval 30 || echo "fin du bot, code $?"
          DURATION=$(( $(date +%s) - START ))
          echo "Durée du bot : ${DURATION} s (prévu : ${PLANNED_MIN} min)"
          # R1 (docs/ACCORD.md) : relance UNIQUEMENT si le bot a tourné >= 10 min (MIN_RUN_SECONDS).
          # Un run court demandé exprès (< 10 min) n'est ni relancé ni signalé comme plantage.
          MIN_RUN_SECONDS=600
          if [ "$DURATION" -ge "$MIN_RUN_SECONDS" ]; then
            echo "LONG_RUN=1" >> "$GITHUB_ENV"
          elif [ "$PLANNED_MIN" -lt 10 ] 2>/dev/null; then
            echo "SHORT_REQUESTED=1" >> "$GITHUB_ENV"
            echo "Run court demandé (${PLANNED_MIN} min) : pas de relance."
          fi
          kill $SAVER 2>/dev/null || true
          save
          echo "----- fin de pilot.log (ntfy masqué) -----"
          tail -n 60 pilot.log | grep -v "HTTP Request" | sed -E 's#ntfy\.sh/[^ "]+#ntfy.sh/***#g' || true

      - name: Arrêt rapide (plantage au démarrage)
        # Bot < 10 min, OU bot jamais lancé (installation ratée...) : PAS de relance (sinon boucle de runs,
        # de commits et d'alertes), alerte ntfy priorité 5, le cron (toutes les 6 h) retentera.
        if: always() && env.STOPPED != '1' && github.event.inputs.chain != 'false' && env.LONG_RUN != '1' && env.SHORT_REQUESTED != '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "ARRÊT RAPIDE : le bot a tourné moins de 10 min (ou n'a pas démarré). Pas de relance, le cron reprendra."
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -o /dev/null -m 15 -H "Title: Bot cloud plante au demarrage" -H "Priority: 5" -H "Tags: rotating_light" \
              -d "Bot cloud plante au démarrage (moins de 10 min). Pas de relance automatique : le cron retentera dans 6 h max. Voir l'onglet Actions." \
              "https://ntfy.sh/$NTFY_TOPIC" || echo "alerte ntfy impossible"
          fi

      - name: Relance de la chaîne
        # Fail-closed (R1) : relance seulement si le bot a vraiment tourné >= 10 min.
        if: always() && env.STOPPED != '1' && github.event.inputs.chain != 'false' && env.LONG_RUN == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # le run suivant attend celui-ci (concurrency) puis reprend l'état de la branche data
          gh workflow run bot-cloud.yml --ref main -f minutes=345 || echo "relance impossible (le cron prendra le relais)"
